---
# Source: adapted from discogsography/.github/dependabot.yml
# Key changes: single-dir fan-out (one service); four ecosystems only.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    cooldown:
      # Deliberately 2 days, not semgrep's suggested 7 (gruvax-ajgw). This is a
      # home-LAN-only kiosk with no public exposure, and the shorter window keeps
      # GRUVAX in step with discogsography. The control is still in force — a
      # same-day compromised release cannot land — just narrower than the default.
      # nosemgrep: dependabot-missing-cooldown
      default-days: 2
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Los_Angeles"
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "dependencies"
      - "ci"
    assignees:
      - "SimplicityGuy"
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/"
    cooldown:
      # Deliberately 2 days, not semgrep's suggested 7 (gruvax-ajgw). This is a
      # home-LAN-only kiosk with no public exposure, and the shorter window keeps
      # GRUVAX in step with discogsography. The control is still in force — a
      # same-day compromised release cannot land — just narrower than the default.
      # nosemgrep: dependabot-missing-cooldown
      default-days: 2
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Los_Angeles"
    commit-message:
      prefix: "docker"
      include: "scope"
    labels:
      - "dependencies"
      - "docker"
    assignees:
      - "SimplicityGuy"

  - package-ecosystem: "npm"
    directory: "/frontend"
    cooldown:
      # Deliberately 2 days, not semgrep's suggested 7 (gruvax-ajgw). This is a
      # home-LAN-only kiosk with no public exposure, and the shorter window keeps
      # GRUVAX in step with discogsography. The control is still in force — a
      # same-day compromised release cannot land — just narrower than the default.
      # nosemgrep: dependabot-missing-cooldown
      default-days: 2
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Los_Angeles"
    commit-message:
      prefix: "deps"
      include: "scope"
    labels:
      - "dependencies"
      - "javascript"
    assignees:
      - "SimplicityGuy"
    groups:
      npm-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "pip"
    directory: "/"
    cooldown:
      # Deliberately 2 days, not semgrep's suggested 7 (gruvax-ajgw). This is a
      # home-LAN-only kiosk with no public exposure, and the shorter window keeps
      # GRUVAX in step with discogsography. The control is still in force — a
      # same-day compromised release cannot land — just narrower than the default.
      # nosemgrep: dependabot-missing-cooldown
      default-days: 2
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Los_Angeles"
    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"
      include: "scope"
    labels:
      - "dependencies"
      - "python"
    assignees:
      - "SimplicityGuy"
    groups:
      python-production:
        dependency-type: "production"
        patterns:
          - "*"
      python-development:
        dependency-type: "development"
        patterns:
          - "*"
      python-security:
        applies-to: security-updates
        patterns:
          - "*"
