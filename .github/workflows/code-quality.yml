# GRUVAX Code Quality Gate — called by build.yml; must pass before test and build run.
#
# Runs pre-commit run --all-files as the single source of truth (D-02).
# No separate ruff/mypy/eslint/prettier/tsc steps — all linters run inside pre-commit.
# Frontend dependencies installed so pre-commit hooks can run eslint/prettier/tsc.

name: Code Quality

on:
  workflow_call:

env:
  CI: true
  PYTHON_VERSION: "3.14"
  NODE_VERSION: "26"

permissions:
  contents: read

jobs:
  code-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up Just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3  # v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache pre-commit
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: ${{ runner.os }}-pre-commit-v1-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pre-commit-v1-

      - name: Install dependencies
        run: uv sync --frozen

      - name: Install frontend dependencies
        run: npm --prefix frontend install

      - name: Run pre-commit (all-files — single source of truth per D-02)
        # Placeholder secrets so pre-commit's docker-compose-check hook can resolve
        # the `${VAR:?}` required-variable substitutions in compose.yaml (the same
        # guards Test 4 validates). These are throwaway CI values — never deployed.
        env:
          GRUVAX_ADMIN_PIN: "1234"
          GRUVAX_SECRET_KEY: "tcS1ujQX9eFv2gXr9w8t1V0qBu3UdMVqJTrYqDQ7Wxg="
          SESSION_SECRET: "ci-test-secret-not-real"
        run: uv run pre-commit run --all-files
