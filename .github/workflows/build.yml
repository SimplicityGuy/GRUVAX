# GRUVAX Build Orchestrator — code-quality gates test + build (D-01).
#
# Triggers on push/PR to main. Workflow-level permission is contents: read.
# packages: write is scoped to the build job only (least privilege, T-9-PERM).
#
# Job graph:
#   run-code-quality (gate)
#     -> run-tests (needs: code-quality)
#     -> run-security (needs: code-quality)
#       -> build (needs: run-tests + run-security, packages: write)
#         -> aggregate-results (always)
#
# Round-trip gate (Plan 01-01 / D-19): the Alembic upgrade -> downgrade ->
# upgrade round-trip lives inside the called `run-tests` workflow
# (test.yml). The gate exercises migration 0009's drop-and-recreate of
# `gruvax.v_collection` and fails the build on any non-zero alembic exit
# (see test.yml step `Alembic round-trip`).

name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CI: true
  PYTHON_VERSION: "3.14"
  NODE_VERSION: "26"
  REGISTRY: ghcr.io

permissions:
  contents: read

jobs:
  run-code-quality:
    uses: ./.github/workflows/code-quality.yml

  run-tests:
    needs: [run-code-quality]
    uses: ./.github/workflows/test.yml

  run-security:
    needs: [run-code-quality]
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
      security-events: write

  build:
    needs: [run-tests, run-security]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set lowercase image name
        run: echo "IMAGE_NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0  # v4.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_TIMESTAMP=${{ github.event.head_commit.timestamp || 'pr-build' }}

      # Plan 01-05 / Blocker #2 RESOLUTION: full compose-up smoke gate.
      # Verifies api + fake-discogsography + init-sync reach a healthy clean
      # boot end-to-end and the init-sync container completes with exit 0
      # (D-16 contract). Runs against ephemeral .env values; the secret-key /
      # PIN here are test-only and never deployed.
      - name: Set up Just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3  # v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Compose smoke gate
        env:
          GRUVAX_ADMIN_PIN: "1234"
          GRUVAX_SECRET_KEY: "tcS1ujQX9eFv2gXr9w8t1V0qBu3UdMVqJTrYqDQ7Wxg="
          SESSION_SECRET: "ci-test-secret-not-real"
          # Plan 01-10 entrypoint requires GRUVAX_ENV=development to fire the
          # gruvax_dev stub bootstrap before alembic upgrade head (migration
          # 0002's CREATE VIEW resolves `collection_items` via search_path).
          # Production deploys leave GRUVAX_ENV unset (-> production default).
          GRUVAX_ENV: "development"
          GIT_SHA: ${{ github.sha }}
        run: just compose-smoke

  aggregate-results:
    runs-on: ubuntu-latest
    needs: [run-code-quality, run-tests, run-security, build]
    if: always()
    steps:
      - name: Check all job results
        run: |
          if [[ "${{ needs.run-code-quality.result }}" != "success" ]] || \
             [[ "${{ needs.run-tests.result }}" != "success" ]] || \
             [[ "${{ needs.run-security.result }}" != "success" ]] || \
             [[ "${{ needs.build.result }}" != "success" ]]; then
            echo "One or more required jobs failed"
            echo "code-quality: ${{ needs.run-code-quality.result }}"
            echo "tests: ${{ needs.run-tests.result }}"
            echo "security: ${{ needs.run-security.result }}"
            echo "build: ${{ needs.build.result }}"
            exit 1
          fi
          echo "All jobs passed"
